name: price-tracker

on:
  schedule:
    - cron: "30 22 * * *" # 매일 07:30 KST
  workflow_dispatch:
  push:
    branches: [claude/vendor-product-price-tracking-6bo0w5]

permissions:
  contents: write
  issues: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    env:
      HAS_MAIL: ${{ secrets.MAIL_USERNAME != '' }}
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tracker
        id: track
        env:
          FOODEN_COOKIE: ${{ secrets.FOODEN_COOKIE }}
          TRACKER_VERBOSE: "1"
        run: python3 tracker/track_price.py

      - name: Run wholesale (wonmul) collector
        if: always()
        run: python3 tracker/wonmul_price.py

      - name: Run import price collector (KATI)
        if: always()
        run: python3 tracker/kati_import.py

      - name: Compose daily report
        id: report
        if: always()
        run: python3 tracker/daily_report.py

      - name: Send daily report to Slack
        if: always() && env.HAS_SLACK == 'true' && github.event_name != 'push'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_SUBJECT: ${{ steps.report.outputs.subject }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = open('tracker/.daily_report.txt', encoding='utf-8').read()
          subject = os.environ.get('REPORT_SUBJECT', '장어 가격 일일 리포트')
          payload = {"text": f"*{subject}*\n```\n{body}\n```"}
          req = urllib.request.Request(
              os.environ['SLACK_WEBHOOK_URL'],
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as resp:
              print('Slack 전송:', resp.status)
          PY

      - name: Send daily report email
        if: always() && env.HAS_MAIL == 'true' && github.event_name != 'push'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.report.outputs.subject }}
          to: info@khglobaltrade.com
          from: 장어 가격 추적기 <${{ secrets.MAIL_USERNAME }}>
          body: file://tracker/.daily_report.txt

      - name: Commit price history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/*.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore(tracker): price check $(TZ=Asia/Seoul date +%F)"
            git push origin "HEAD:${GITHUB_REF_NAME}" \
              || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; }
          fi

      - name: Upload page snapshot (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-snapshot-${{ github.run_number }}
          path: tracker/.debug/
          if-no-files-found: ignore
          retention-days: 5
          include-hidden-files: true

      - name: Open issue on price change
        if: always() && steps.track.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            for (const f of ['tracker/.change_note.md', 'tracker/.market_note.md']) {
              try { parts.push(fs.readFileSync(f, 'utf8')); } catch (e) {}
            }
            const body = parts.join('\n\n---\n\n')
              || '가격 변동이 감지되었습니다. tracker/ 폴더의 CSV를 확인하세요.';
            const today = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 가격 변동 감지 (${today} KST)`,
              body,
            });
