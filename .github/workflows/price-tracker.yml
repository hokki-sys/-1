name: price-tracker

on:
  schedule:
    - cron: "30 22 * * *" # 매일 07:30 KST
  workflow_dispatch:
  push:
    branches: [claude/vendor-product-price-tracking-6bo0w5]

permissions:
  contents: write
  issues: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tracker
        id: track
        env:
          FOODEN_COOKIE: ${{ secrets.FOODEN_COOKIE }}
          TRACKER_VERBOSE: "1"
        run: python3 tracker/track_price.py

      - name: Commit price history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/price_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "chore(tracker): price check $(TZ=Asia/Seoul date +%F)"
            git push origin "HEAD:${GITHUB_REF_NAME}" \
              || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; }
          fi

      - name: Upload page snapshot (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-snapshot-${{ github.run_number }}
          path: tracker/.debug/
          if-no-files-found: ignore
          retention-days: 5
          include-hidden-files: true

      - name: Open issue on price change
        if: steps.track.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '가격 변동이 감지되었습니다. tracker/price_history.csv 를 확인하세요.';
            try { body = fs.readFileSync('tracker/.change_note.md', 'utf8'); } catch (e) {}
            const today = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 가격 변동 감지 (${today} KST)`,
              body,
            });
